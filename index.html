<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>资源鉴・60秒资讯简报</title>
<style>
body {padding: 20px; background: #f0f2f5; text-align: center; font-family: "微软雅黑", sans-serif; margin: 0;}
#posterContainer {max-width: 620px; margin: 0 auto;}
#posterImg {max-width: 100%; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);}
#stepTip {font-size: 16px; color: #666; margin: 20px 0; min-height: 40px; display: flex; align-items: center; justify-content: center;}
.loading-spinner {display: inline-block; width: 20px; height: 20px; border: 2px solid #e0e0e0; border-top: 2px solid #367efc; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px;}
@keyframes spin {0% {transform: rotate(0deg);} 100% {transform: rotate(360deg);}}
.error {color: #e64340; padding: 10px; background: #ffeaea; border-radius: 8px; margin: 10px 0;}
.refresh-btn {margin: 15px auto; padding: 10px 25px; background: #367efc; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; display: block;}
.status-info {color: #666; font-size: 14px; margin-top: 10px;}
</style>
</head>
<body>
<div id="stepTip">
    <div class="loading-spinner"></div>
    <span>正在初始化...</span>
</div>
<div id="posterContainer"></div>
<button id="refreshBtn" class="refresh-btn" onclick="location.reload()" style="display:none;">刷新重试</button>
<div id="statusInfo" class="status-info"></div>

<script>
// ==================== 配置区域 ====================
const CONFIG = {
    // 主要API源（优先使用）
    API_SOURCES: [
        {
            name: "原接口",
            url: "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://v3.alapi.cn/api/zaobao?token=j6H97ztRoOm1JbJh&format=json")
        },
        {
            name: "原接口备用",
            url: "https://corsproxy.io/?" + encodeURIComponent("https://v3.alapi.cn/api/zaobao?token=j6H97ztRoOm1JbJh&format=json")
        },
        {
            name: "备用源1",
            url: "https://api.vvhan.com/api/60s?type=json"
        },
        {
            name: "备用源2",
            url: "https://api.oddfar.com/zaobao.php"
        }
    ],
    
    QR_CODE_URL: "pZhPaqA.jpg",
    POSTER_WIDTH: 600,
    REFRESH_HOUR: 6,
    CACHE_KEY: "newsBriefCache_Method1",
    
    COLORS: {
        primary: "#367efc",
        primaryLight: "#5a95ff",
        secondary: "#6c8ebf",
        textMain: "#2d3748",
        textSub: "#718096",
        textLight: "#a0aec0",
        bgMain: "#ffffff",
        bgSub: "#f8f9fa",
        border: "#e2e8f0",
        splitLine: "#e8f0fe"
    }
};

// 获取DOM元素
const stepTip = document.getElementById("stepTip");
const posterContainer = document.getElementById("posterContainer");
const refreshBtn = document.getElementById("refreshBtn");
const statusInfo = document.getElementById("statusInfo");

// 更新状态显示
function updateStatus(text, isError = false) {
    stepTip.innerHTML = isError ? 
        `<span class="error">❌ ${text}</span>` : 
        `<div class="loading-spinner"></div><span>${text}</span>`;
    
    if (isError) {
        refreshBtn.style.display = "block";
    }
}

// 更新状态信息
function updateStatusInfo(text) {
    statusInfo.textContent = text;
}

// ==================== 缓存管理 ====================
function needRefreshFromApi() {
    const cacheData = localStorage.getItem(CONFIG.CACHE_KEY);
    if (!cacheData) return true;
    
    try {
        const { cacheTime } = JSON.parse(cacheData);
        const now = new Date();
        const cacheDate = new Date(cacheTime);
        const todayRefreshTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), CONFIG.REFRESH_HOUR, 0, 0);
        
        return (now >= todayRefreshTime && cacheDate < todayRefreshTime);
    } catch {
        return true;
    }
}

function getCacheData() {
    const cacheData = localStorage.getItem(CONFIG.CACHE_KEY);
    return cacheData ? JSON.parse(cacheData).data : null;
}

function setCacheData(data) {
    const cacheContent = {
        cacheTime: new Date().toISOString(),
        data: data
    };
    localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify(cacheContent));
}

// ==================== 数据获取函数 ====================
async function fetchNewsData() {
    // 1. 优先使用缓存
    if (!needRefreshFromApi()) {
        const cached = getCacheData();
        if (cached) {
            updateStatusInfo("使用缓存数据");
            return cached;
        }
    }
    
    // 2. 从多个API源获取数据
    updateStatus("正在获取最新数据...");
    
    let lastError = null;
    
    for (let i = 0; i < CONFIG.API_SOURCES.length; i++) {
        const source = CONFIG.API_SOURCES[i];
        
        try {
            updateStatusInfo(`尝试 ${source.name}...`);
            
            // 设置超时
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            
            const response = await fetch(source.url, {
                signal: controller.signal,
                headers: {
                    'Accept': 'application/json',
                    'Cache-Control': 'no-cache'
                }
            });
            
            clearTimeout(timeoutId);
            
            if (!response.ok) {
                throw new Error(`${source.name}: HTTP ${response.status}`);
            }
            
            const result = await response.json();
            console.log(`${source.name} 返回数据:`, result);
            
            // 3. 解析不同格式的数据
            let finalData = null;
            
            if (source.name.includes("原接口")) {
                // 原接口格式: { data: { date, news, weiyu } }
                finalData = result.data || result;
            } else if (source.name.includes("备用源1")) {
                // vvhan.com格式: { date, news, weiyu }
                finalData = {
                    date: result.date,
                    news: result.news,
                    weiyu: result.weiyu || "把握当下，放眼未来"
                };
            } else if (source.name.includes("备用源2")) {
                // oddfar.com格式: { date, news }
                finalData = {
                    date: result.date,
                    news: result.news || [],
                    weiyu: "每日微语，启迪心灵"
                };
            } else {
                // 默认处理
                finalData = result.data || result;
            }
            
            // 4. 验证数据
            if (!finalData || !finalData.date) {
                throw new Error("数据格式不正确");
            }
            
            if (!Array.isArray(finalData.news)) {
                finalData.news = [];
            }
            
            if (!finalData.weiyu) {
                finalData.weiyu = "每一刻的努力，都在为未来铺路";
            }
            
            // 5. 缓存并返回数据
            updateStatusInfo(`${source.name} 获取成功`);
            setCacheData(finalData);
            
            return finalData;
            
        } catch (error) {
            console.warn(`${source.name} 失败:`, error.message);
            lastError = error;
            
            // 如果不是最后一个源，继续尝试下一个
            if (i < CONFIG.API_SOURCES.length - 1) {
                await new Promise(resolve => setTimeout(resolve, 500));
                continue;
            }
        }
    }
    
    // 6. 所有API都失败，尝试缓存
    updateStatusInfo("所有API尝试失败，尝试使用缓存");
    const cached = getCacheData();
    if (cached) {
        return cached;
    }
    
    // 7. 缓存也没有，返回兜底数据
    throw new Error("无法获取数据，请检查网络连接");
}

// ==================== 二维码加载 ====================
async function loadQRImage() {
    const qrUrl = CONFIG.QR_CODE_URL;
    return new Promise((resolve) => {
        const img = new Image();
        
        // 如果是相对路径，添加时间戳防止缓存
        const finalUrl = qrUrl === "pZhPaqA.jpg" ? 
            qrUrl + "?t=" + Date.now() : 
            qrUrl;
            
        img.src = finalUrl;
        img.crossOrigin = "anonymous";
        
        img.onload = () => {
            console.log("二维码加载成功");
            resolve(img);
        };
        
        img.onerror = () => {
            console.warn("二维码加载失败，使用默认");
            // 创建默认二维码
            const canvas = document.createElement('canvas');
            canvas.width = 80;
            canvas.height = 80;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = CONFIG.COLORS.primary;
            ctx.fillRect(0, 0, 80, 80);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('资源', 40, 32);
            ctx.fillText('鉴', 40, 50);
            
            const defaultImg = new Image();
            defaultImg.src = canvas.toDataURL();
            resolve(defaultImg);
        };
    });
}

// ==================== 海报生成函数 ====================
function calculateExactHeight(news, weiyu) {
    const baseMargin = 25, titleH = 120, dateH = 40, newsGap = 10, lineHeight = 30, weiyuPad = 15, newsWeiyuGap = 10;
    const tempCtx = document.createElement("canvas").getContext("2d");
    tempCtx.font = "17px 微软雅黑";
    
    // 计算新闻高度
    let newsH = 0;
    const newsMaxW = CONFIG.POSTER_WIDTH - 2 * baseMargin - 50;
    
    news.forEach(item => {
        let lines = 1, lineText = "";
        for (const char of item) {
            if (tempCtx.measureText(lineText + char).width > newsMaxW) { 
                lines++; 
                lineText = char; 
            } else { 
                lineText += char; 
            }
        }
        newsH += lines * lineHeight + newsGap;
    });
    
    newsH = newsH > 0 ? newsH - newsGap : 0;
    
    // 计算微语高度
    let weiyuLines = 1, weiyuText = "";
    const weiyuMaxW = CONFIG.POSTER_WIDTH - 2 * baseMargin - 2 * weiyuPad;
    
    for (const char of weiyu) {
        if (tempCtx.measureText(weiyuText + char).width > weiyuMaxW) { 
            weiyuLines++; 
            weiyuText = char; 
        } else { 
            weiyuText += char; 
        }
    }
    
    const weiyuH = weiyuPad * 2 + weiyuLines * lineHeight;
    
    return baseMargin * 2 + titleH + dateH + newsH + newsWeiyuGap + weiyuH;
}

function drawPosterBackground(ctx, w, h) {
    ctx.fillStyle = CONFIG.COLORS.bgMain;
    roundRect(ctx, 0, 0, w, h, 20, true);
    ctx.fillStyle = "rgba(0,0,0,0.02)";
    roundRect(ctx, 2, 2, w - 4, h - 4, 18, true);
}

function roundRect(ctx, x, y, width, height, radius, fill) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + width, y, x + width, y + height, radius);
    ctx.arcTo(x + width, y + height, x, y + height, radius);
    ctx.arcTo(x, y + height, x, y, radius);
    ctx.arcTo(x, y, x + width, y, radius);
    ctx.closePath();
    if (fill) ctx.fill();
}

function drawModules(ctx, date, news, weiyu, qrImage) {
    const W = CONFIG.POSTER_WIDTH, H = ctx.canvas.height;
    const baseMargin = 25, lineHeight = 30, weiyuPad = 15, newsWeiyuGap = 10;
    
    let y = baseMargin;
    
    // 绘制标题
    const gradient = ctx.createLinearGradient(0, y, W, y);
    gradient.addColorStop(0, CONFIG.COLORS.primary);
    gradient.addColorStop(1, CONFIG.COLORS.primaryLight);
    
    ctx.font = "bold 30px 微软雅黑";
    ctx.fillStyle = gradient;
    ctx.textAlign = "center";
    ctx.fillText("资源鉴・60秒资讯简报", W/2, y + 50);
    
    // 标题下划线
    ctx.strokeStyle = CONFIG.COLORS.splitLine;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W/2 - 110, y + 70);
    ctx.lineTo(W/2 + 110, y + 70);
    ctx.stroke();
    
    // 绘制二维码
    if (qrImage) {
        const qrSize = 80;
        const qrX = W - baseMargin - qrSize;
        const qrY = y + (95 - qrSize) / 2;
        
        // 二维码背景
        ctx.fillStyle = CONFIG.COLORS.bgSub;
        ctx.beginPath();
        ctx.arc(qrX + qrSize/2, qrY + qrSize/2, qrSize/2 + 4, 0, Math.PI * 2);
        ctx.fill();
        
        // 二维码图片
        ctx.drawImage(qrImage, qrX, qrY, qrSize, qrSize);
        
        // 二维码文字
        ctx.font = "12px 微软雅黑";
        ctx.fillStyle = CONFIG.COLORS.textSub;
        ctx.fillText("扫码查看更多内容", qrX + qrSize/2, qrY + qrSize + 18);
    }
    
    // 绘制日期
    ctx.textAlign = "left";
    y += 120;
    ctx.font = "19px 微软雅黑";
    ctx.fillStyle = CONFIG.COLORS.textSub;
    ctx.textAlign = "center";
    
    const weekList = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    let weekDay = "";
    try {
        const [y, m, d] = date.split("-").map(Number);
        weekDay = weekList[new Date(y, m-1, d).getDay()];
    } catch {
        weekDay = "";
    }
    
    const fullDate = `${date} ${weekDay}`;
    ctx.fillText(fullDate, W/2, y + 25);
    
    // 绘制新闻列表
    ctx.textAlign = "left";
    y += 40;
    ctx.font = "17px 微软雅黑";
    const newsMaxW = W - 2 * baseMargin - 50;
    
    news.forEach((item, idx) => {
        // 序号圆圈
        ctx.fillStyle = CONFIG.COLORS.primary;
        const numX = baseMargin;
        const numY = y + 18;
        ctx.beginPath();
        ctx.arc(numX + 11, numY - 7, 9, 0, Math.PI * 2);
        ctx.fill();
        
        // 序号数字
        ctx.font = "13px 微软雅黑";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.fillText(`${idx + 1}`, numX + 11, numY - 3);
        
        // 新闻内容
        ctx.textAlign = "left";
        ctx.font = "17px 微软雅黑";
        ctx.fillStyle = CONFIG.COLORS.textMain;
        y = drawWrapText(ctx, item, baseMargin + 30, y, newsMaxW, lineHeight);
        y += 10;
    });
    
    if (news.length > 0) y -= 10;
    y += newsWeiyuGap;
    
    // 绘制微语
    const weiyuMaxW = W - 2 * baseMargin - 2 * weiyuPad;
    const tempCtx = document.createElement("canvas").getContext("2d");
    tempCtx.font = "17px 微软雅黑";
    
    let weiyuLines = 1, weiyuText = "";
    for (const char of weiyu) {
        if (tempCtx.measureText(weiyuText + char).width > weiyuMaxW) { 
            weiyuLines++; 
            weiyuText = char; 
        } else { 
            weiyuText += char; 
        }
    }
    
    const weiyuBgH = weiyuPad * 2 + weiyuLines * lineHeight;
    ctx.fillStyle = CONFIG.COLORS.bgSub;
    roundRect(ctx, baseMargin, y, W - 2 * baseMargin, weiyuBgH, 10, true);
    
    ctx.strokeStyle = CONFIG.COLORS.border;
    ctx.lineWidth = 1;
    roundRect(ctx, baseMargin, y, W - 2 * baseMargin, weiyuBgH, 10, false);
    
    ctx.font = "17px 微软雅黑";
    ctx.fillStyle = CONFIG.COLORS.textSub;
    drawWrapText(ctx, weiyu, baseMargin + weiyuPad, y + weiyuPad, weiyuMaxW, lineHeight);
}

function drawWrapText(ctx, text, x, y, maxWidth, lineHeight) {
    let currentLine = "", currentY = y;
    
    for (const char of text) {
        if (ctx.measureText(currentLine + char).width > maxWidth) {
            ctx.fillText(currentLine, x, currentY + 18);
            currentLine = char;
            currentY += lineHeight;
        } else {
            currentLine += char;
        }
    }
    
    if (currentLine) {
        ctx.fillText(currentLine, x, currentY + 18);
    }
    
    return currentY + lineHeight;
}

// ==================== 主流程 ====================
async function run() {
    try {
        // 1. 检查网络
        if (!navigator.onLine) {
            throw new Error("网络连接已断开，请检查网络");
        }
        
        // 2. 并行加载数据
        updateStatus("正在初始化...");
        
        const [newsData, qrImage] = await Promise.all([
            fetchNewsData().catch(error => {
                console.error("获取新闻失败:", error);
                
                // 尝试使用缓存
                const cached = getCacheData();
                if (cached) {
                    updateStatusInfo("使用缓存数据");
                    return cached;
                }
                
                // 没有缓存，使用兜底数据
                const today = new Date();
                return {
                    date: `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`,
                    news: ['数据加载中，请稍后刷新。', '建议在Wi-Fi环境下使用。'],
                    weiyu: '耐心是所有智慧的基础。'
                };
            }),
            loadQRImage()
        ]);
        
        // 3. 准备数据
        const { date, news, weiyu } = newsData;
        const handleNews = Array.isArray(news) ? 
            news.map(item => item.replace(/^\d+、/, "").trim()).filter(Boolean) : 
            [];
        
        // 4. 计算高度并创建画布
        updateStatus("正在生成海报...");
        
        const totalHeight = calculateExactHeight(handleNews, weiyu);
        const canvas = document.createElement("canvas");
        canvas.width = CONFIG.POSTER_WIDTH;
        canvas.height = totalHeight;
        const ctx = canvas.getContext("2d");
        
        // 5. 绘制海报
        drawPosterBackground(ctx, canvas.width, canvas.height);
        drawModules(ctx, date, handleNews, weiyu, qrImage);
        
        // 6. 显示海报
        const posterUrl = canvas.toDataURL("image/png");
        const img = document.createElement("img");
        img.id = "posterImg";
        img.src = posterUrl;
        
        posterContainer.innerHTML = "";
        posterContainer.appendChild(img);
        
        // 7. 隐藏加载状态
        stepTip.style.display = "none";
        updateStatusInfo(`生成时间: ${new Date().toLocaleTimeString()} | 新闻数: ${handleNews.length}`);
        
    } catch (error) {
        console.error("运行时错误:", error);
        updateStatus(`生成失败：${error.message}`, true);
        
        // 显示兜底海报
        try {
            const canvas = document.createElement("canvas");
            canvas.width = CONFIG.POSTER_WIDTH;
            canvas.height = 400;
            const ctx = canvas.getContext("2d");
            
            ctx.fillStyle = CONFIG.COLORS.bgMain;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = "bold 24px 微软雅黑";
            ctx.fillStyle = CONFIG.COLORS.primary;
            ctx.textAlign = "center";
            ctx.fillText("资源鉴・60秒资讯简报", canvas.width/2, 100);
            
            ctx.font = "16px 微软雅黑";
            ctx.fillStyle = CONFIG.COLORS.textSub;
            ctx.fillText("数据加载失败", canvas.width/2, 150);
            ctx.fillText("请点击下方按钮刷新", canvas.width/2, 180);
            
            const posterUrl = canvas.toDataURL("image/png");
            const img = document.createElement("img");
            img.src = posterUrl;
            
            posterContainer.innerHTML = "";
            posterContainer.appendChild(img);
        } catch (e) {
            console.error("生成错误海报失败:", e);
        }
    }
}

// ==================== 初始化 ====================
// 页面加载完成后运行
document.addEventListener('DOMContentLoaded', run);

// 添加离线检测
window.addEventListener('offline', function() {
    updateStatus("网络连接已断开", true);
});

window.addEventListener('online', function() {
    if (refreshBtn.style.display === 'block') {
        updateStatus("网络已恢复，正在重试...");
        setTimeout(() => location.reload(), 1000);
    }
});
</script>
</body>
</html>
